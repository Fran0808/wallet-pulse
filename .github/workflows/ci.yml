name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-ci:
    name: Backend API (Java 21 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finance_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test Backend API
        run: |
          cd api
          mvn clean test compile -Dspring.datasource.url=jdbc:postgresql://localhost:5432/finance_db -Dspring.datasource.username=postgres -Dspring.datasource.password=admin

  android-ci:
    name: Android App (Kotlin / Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests and Assemble Debug APK
        run: |
          cd android
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
